[package]
name = "api"
version = "0.0.0"
license = "AGPL-3.0-only"
edition = "2024"
rust-version = "1.98"
publish = false

[[bin]]
name = "api"
path = "src/main.rs"

[dependencies]
tronc = { git = "https://github.com/FacileStudio/tronc-rs", tag = "v0.3.0", features = ["http", "health", "spa", "migrate", "journal", "apiref"] }
porte = { git = "https://github.com/FacileStudio/porte-rs", tag = "v0.5.2", features = ["pg", "oidc", "directory", "spaces"] }
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["macros"] }
http = "1.5.0"
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "time", "json", "migrate", "derive", "macros"] }
time = { version = "0.3.55", features = ["serde", "formatting", "parsing", "serde-well-known"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
utoipa = "6.0.0"
uuid = { version = "1.29.2", features = ["v4", "serde"] }

[dev-dependencies]
tronc = { git = "https://github.com/FacileStudio/tronc-rs", tag = "v0.3.0", features = ["testdb"] }
http-body-util = "0.1.5"
serde_json = "1.0.154"
tower = { version = "0.5.3", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2
