<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<title>Toile · An infinite shared whiteboard</title>
		<meta name="description" content="Sticky notes, shapes, arrows and ink on one infinite board, drawn together with your team in real time." />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="/favicon.ico" sizes="48x48" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/site.webmanifest" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafafa" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a" />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Facile" />
		<meta property="og:locale" content="en_US" />
		<meta property="og:url" content="https://toile.facile.studio/" />
		<meta property="og:title" content="Toile · An infinite shared whiteboard" />
		<meta property="og:description" content="Sticky notes, shapes, arrows and ink on one infinite board, drawn together with your team in real time." />
		<meta property="og:image" content="https://toile.facile.studio/og-image.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="Toile: An infinite shared whiteboard" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Toile · An infinite shared whiteboard" />
		<meta name="twitter:description" content="Sticky notes, shapes, arrows and ink on one infinite board, drawn together with your team in real time." />
		<meta name="twitter:image" content="https://toile.facile.studio/og-image.png" />
		<link rel="canonical" href="https://toile.facile.studio/" />
		<script>try{var t=localStorage.getItem('toile.theme');if(t==='dark'||t==='light')document.documentElement.classList.add(t)}catch(e){}</script>
		<script>
			(function () {
				if (location.hostname !== 'toile.facile.studio') return;
				if (location.pathname.indexOf('/s/') === 0) return;
				var s = document.createElement('script');
				s.async = true;
				s.src = 'https://vision.facile.studio/s.js';
				s.setAttribute('data-mask', '');
				document.head.appendChild(s);
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
