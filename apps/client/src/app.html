<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<meta name="description" content="Toile, le tableau blanc infini de Facile : post-it, formes, flèches et dessin à main levée, à plusieurs et en direct. Gratuit, sur le web, le bureau et le mobile." />
		<link rel="canonical" href="https://toile.facile.studio/" />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Toile" />
		<meta property="og:locale" content="fr_FR" />
		<meta property="og:url" content="https://toile.facile.studio/" />
		<meta property="og:title" content="Toile · le tableau blanc infini de Facile" />
		<meta property="og:description" content="Post-it, flèches et dessin, à plusieurs et en direct. Gratuit, sans limite de tableaux." />
		<meta property="og:image" content="https://toile.facile.studio/og.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="Toile, le tableau blanc infini de Facile" />
		<meta name="twitter:card" content="summary_large_image" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="32x32" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a" />
		<script>try{var t=localStorage.getItem('toile.theme');if(t==='dark'||t==='light')document.documentElement.classList.add(t)}catch(e){}</script>
		%sveltekit.head%
		<title>Toile</title>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
