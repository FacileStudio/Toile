services:
  toile-db:
    container_name: toile-db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: toile
      POSTGRES_PASSWORD: ${TOILE_DB_PASSWORD:-toile-internal-db}
      POSTGRES_DB: toile
    volumes:
    - db_data:/var/lib/postgresql/data
    expose:
    - '5432'
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U toile
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s
    deploy:
      update_config:
        order: stop-first
        parallelism: 1
      restart_policy:
        condition: any
  toile-api:
    container_name: toile-api
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    expose:
    - '4000'
    networks:
    - default
    - dokploy-network
    labels:
      traefik.enable: 'true'
      traefik.docker.network: dokploy-network
      traefik.http.routers.toile-web.rule: "Host(`toile.facile.studio`)"
      traefik.http.routers.toile-web.entrypoints: web
      traefik.http.routers.toile-web.middlewares: redirect-to-https@file
      traefik.http.routers.toile-web.service: toile-api
      traefik.http.routers.toile-secure.rule: "Host(`toile.facile.studio`)"
      traefik.http.routers.toile-secure.entrypoints: websecure
      traefik.http.routers.toile-secure.tls.certresolver: letsencrypt
      traefik.http.routers.toile-secure.service: toile-api
      traefik.http.services.toile-api.loadbalancer.server.port: "4000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://toile:${TOILE_DB_PASSWORD:-toile-internal-db}@toile-db:5432/toile?sslmode=disable}
      PORT: '4000'
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUSTED_PROXIES: 'private,cloudflare'
      JOURNAL_URL: ${JOURNAL_URL:-}
      JOURNAL_TOKEN: ${JOURNAL_TOKEN:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      PORTE_TOKEN_KEY: ${PORTE_TOKEN_KEY:-}
      OIDC_REDIRECT_URL: ${OIDC_REDIRECT_URL:-}
      OIDC_SUCCESS_URL: ${OIDC_SUCCESS_URL:-}
      OIDC_CLI_AUDIENCE: ${OIDC_CLI_AUDIENCE:-}
      MCP_RESOURCE: ${MCP_RESOURCE:-}
      MCP_STATE_KEY: ${MCP_STATE_KEY:-}
      NUAGE_URL: ${NUAGE_URL:-https://nuage.facile.studio}
      NUAGE_CLIENT_ID: ${NUAGE_CLIENT_ID:-}
      OPUS_URL: ${OPUS_URL:-https://opus.facile.studio}
      OPUS_CLIENT_ID: ${OPUS_CLIENT_ID:-}
      DOCS_URL: ${DOCS_URL:-https://docs.facile.studio}
      DOCS_CLIENT_ID: ${DOCS_CLIENT_ID:-}
      FEUILLES_URL: ${FEUILLES_URL:-https://feuilles.facile.studio}
      FEUILLES_CLIENT_ID: ${FEUILLES_CLIENT_ID:-}
      AGENDA_URL: ${AGENDA_URL:-https://agenda.facile.studio}
      AGENDA_CLIENT_ID: ${AGENDA_CLIENT_ID:-}
      BULLE_URL: ${BULLE_URL:-https://bulle.facile.studio}
      BULLE_CLIENT_ID: ${BULLE_CLIENT_ID:-bulle}
    healthcheck:
      test: ["CMD", "/api", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 1s
    depends_on:
      toile-db:
        condition: service_healthy
    deploy:
      replicas: 1
      update_config:
        order: stop-first
        parallelism: 1
      restart_policy:
        condition: any
volumes:
  db_data:
    name: toile_db_data
networks:
  dokploy-network:
    external: true
