name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust from rust-toolchain.toml
        working-directory: apps/api
        run: |
          rustup toolchain install
          rustc --version

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/api/target
          key: cargo-${{ runner.os }}-${{ hashFiles('apps/api/rust-toolchain.toml') }}-${{ hashFiles('apps/api/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ hashFiles('apps/api/rust-toolchain.toml') }}-

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install the client packages
        working-directory: apps/client
        run: bun install --frozen-lockfile

      - name: Install Playwright's Chromium
        working-directory: apps/client
        run: |
          bunx playwright-core install --only-shell chromium && exit 0
          for attempt in 1 2 3; do
            bunx playwright-core install --with-deps --only-shell chromium && exit 0
            sleep 30
          done
          exit 1

      - name: gate
        run: sh scripts/check.sh

      - uses: FacileStudio/filet@744b06fb5c4ad7d6a86014a0ebe7700a3553ca54 # v0.19.1
        with:
          version: v0.19.1
          fail-on: error
          antenne-url: ${{ secrets.ANTENNE_FILET_SECRET != '' && 'https://antenne.facile.studio/webhook/filet' || '' }}
          antenne-secret: ${{ secrets.ANTENNE_FILET_SECRET }}

  desktop:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux libraries
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev libdbus-1-dev patchelf libssl-dev

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/target
          key: desktop-${{ runner.os }}-${{ hashFiles('apps/desktop/Cargo.lock') }}
          restore-keys: desktop-${{ runner.os }}-

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Build the client the shell embeds
        working-directory: apps/client
        run: bun install --frozen-lockfile && bun run build

      - name: Lint and test the shell
        working-directory: apps/desktop
        run: |
          rustup component add clippy rustfmt
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
          bun install --frozen-lockfile
          bun run test
