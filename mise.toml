[tools]
lefthook = "latest"
bun = "1.4.2"

[hooks]
postinstall = "lefthook install"

[tasks.bootstrap]
description = "Fetch the API crates and install the client"
run = "cd apps/api && cargo fetch --locked && cd ../client 2>/dev/null && bun install --frozen-lockfile || true"

[tasks.db-up]
description = "Start the repo-local Postgres on 127.0.0.1:5657"
run = "sh ./scripts/postgres-up.sh"

[tasks.db-down]
description = "Stop the repo-local Postgres"
run = "sh ./scripts/postgres-down.sh"

[tasks.dev]
description = "Run the API against the local database"
env = { DATABASE_URL = "postgres://postgres:postgres@127.0.0.1:5657/postgres?sslmode=disable", PORT = "4000" }
run = "cd apps/api && cargo run"

[tasks.build]
description = "Build the API in release mode"
run = "cd apps/api && cargo build --release --locked"

[tasks.check]
description = "Run the full quality gate"
run = "sh ./scripts/check.sh"

[tasks.e2e]
description = "Run the browser end-to-end test against the real API (Postgres, headless Chromium)"
depends = ["db-up"]
run = "sh ./scripts/e2e.sh"
